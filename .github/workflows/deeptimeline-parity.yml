name: deeptimeline parity

# Guards EN/JA static-HTML parity on the deep timeline pages.
# Fails if public/deeptimeline.html and public/ja/deeptimeline.html drift
# (missing/unlinked entries, reordering, dead local hrefs).
# Same check runs in npm run build / preview / deploy — see AGENTS.md.

on:
  push:
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check EN/JA deep timeline parity
        run: node scripts/check-deeptimeline-parity.mjs
