name: static page checks

# Guards the two classes of silent static-HTML drift that shipped broken
# content to production before:
#   - EN/JA deep timeline parity (missing/unlinked index entries)
#   - JSON-LD/AEO integrity (unparseable blocks, redirecting canonicals,
#     dead image URLs, EN/JA FAQPage parity, missing AEO tags)
# Same checks run in npm run build / preview / deploy — see AGENTS.md.

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check EN/JA deep timeline parity
        run: node scripts/check-deeptimeline-parity.mjs
      - name: Check JSON-LD / AEO integrity
        run: node scripts/check-structured-data.mjs
      - name: Check JA style / terminology
        run: node scripts/check-ja-style.mjs
