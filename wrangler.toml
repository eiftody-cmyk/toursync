name = "toursync"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [
  { pattern = "osakacastletours.com/_next/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/api/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/book*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/dashboard", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/dashboard/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/calendar", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/calendar/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/tours", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/tours/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/settings", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/settings/*", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/login", zone_name = "osakacastletours.com" },
  { pattern = "osakacastletours.com/auth/*", zone_name = "osakacastletours.com" },
]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_BASE_URL = "https://osakacastletours.com"
NEXT_PUBLIC_SUPABASE_URL = "https://yxqhxmurckdjiulfdvpc.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl4cWh4bXVyY2tkaml1bGZkdnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjM3MDksImV4cCI6MjEwMzgzOTcwOX0.JvwmYD9krQbnNnnrlfMpGxvA8HuhKLW_JwBp6YcvVts"
NODE_ENV = "production"
OTA_SYNC_ENABLED = "true"
# Photography after dark hidden from public booking pages only.
# GYG live testing covers Photography (1c2535d2) + Before Japan (6b3bc718);
# its TimePeriodGroup config cannot be sold per-person on-site.
HIDDEN_TOUR_IDS = "1c2535d2-a946-4da6-ad35-5df42339323e"
